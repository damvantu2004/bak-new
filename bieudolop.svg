<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="auto" viewBox="0 0 2000 1400" preserveAspectRatio="xMinYMin meet">
  
  <!-- Tiêu đề biểu đồ -->
  <text x="1000" y="30" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">Biểu đồ lớp đầy đủ - Hệ thống Bakery</text>
  
  <!-- Marker definitions -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
    <marker id="diamond" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <polygon points="0,6 6,0 12,6 6,12" fill="white" stroke="black" stroke-width="1"/>
    </marker>
  </defs>
  
  <!-- Account/User Entity -->
  <rect x="50" y="80" width="280" height="280" fill="#FFF2CC" stroke="black" stroke-width="2"/>
  <text x="190" y="100" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Account</text>
  <line x1="50" y1="110" x2="330" y2="110" stroke="black" stroke-width="1"/>
  
  <text x="60" y="130" font-family="Arial" font-size="13">+ id : int(11) PK</text>
  <text x="60" y="145" font-family="Arial" font-size="13">+ fname : varchar(100)</text>
  <text x="60" y="160" font-family="Arial" font-size="13">+ lname : varchar(100)</text>
  <text x="60" y="175" font-family="Arial" font-size="13">+ email : varchar(100)</text>
  <text x="60" y="190" font-family="Arial" font-size="13">+ phone : varchar(100)</text>
  <text x="60" y="205" font-family="Arial" font-size="13">+ password : varchar(100)</text>
  <text x="60" y="220" font-family="Arial" font-size="13">+ remember_token : varchar(150)</text>
  <text x="60" y="235" font-family="Arial" font-size="13">+ verification_token : varchar(150)</text>
  <text x="60" y="250" font-family="Arial" font-size="13">+ email_verified_at : datetime</text>
  <text x="60" y="265" font-family="Arial" font-size="13">+ province : varchar(50)</text>
  <text x="60" y="280" font-family="Arial" font-size="13">+ address : varchar(255)</text>
  <text x="60" y="295" font-family="Arial" font-size="13">+ role : varchar(50)</text>
  <text x="60" y="310" font-family="Arial" font-size="13">+ status : tinyint(1)</text>
  <text x="60" y="325" font-family="Arial" font-size="13">+ created_at : date</text>
  <text x="60" y="340" font-family="Arial" font-size="13">+ updated_at : date</text>
  
  <!-- Category Entity -->
  <rect x="400" y="80" width="280" height="180" fill="#FFF2CC" stroke="black" stroke-width="2"/>
  <text x="540" y="100" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Category</text>
  <line x1="400" y1="110" x2="680" y2="110" stroke="black" stroke-width="1"/>
  
  <text x="410" y="130" font-family="Arial" font-size="13">+ id : int(11) PK</text>
  <text x="410" y="145" font-family="Arial" font-size="13">+ name : varchar(100)</text>
  <text x="410" y="160" font-family="Arial" font-size="13">+ status : tinyint(1)</text>
  <text x="410" y="175" font-family="Arial" font-size="13">+ priority : tinyint(4)</text>
  <text x="410" y="190" font-family="Arial" font-size="13">+ created_at : date</text>
  <text x="410" y="205" font-family="Arial" font-size="13">+ updated_at : date</text>
  
  <!-- Product Entity -->
  <rect x="750" y="80" width="280" height="260" fill="#FFF2CC" stroke="black" stroke-width="2"/>
  <text x="890" y="100" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Product</text>
  <line x1="750" y1="110" x2="1030" y2="110" stroke="black" stroke-width="1"/>
  
  <text x="760" y="130" font-family="Arial" font-size="13">+ id : int(11) PK</text>
  <text x="760" y="145" font-family="Arial" font-size="13">+ name : varchar(200)</text>
  <text x="760" y="160" font-family="Arial" font-size="13">+ image : varchar(200)</text>
  <text x="760" y="175" font-family="Arial" font-size="13">+ price : float(9,3)</text>
  <text x="760" y="190" font-family="Arial" font-size="13">+ sale_price : float(9,3)</text>
  <text x="760" y="205" font-family="Arial" font-size="13">+ description : text</text>
  <text x="760" y="220" font-family="Arial" font-size="13">+ origin : varchar(100)</text>
  <text x="760" y="235" font-family="Arial" font-size="13">+ quantity : int(11)</text>
  <text x="760" y="250" font-family="Arial" font-size="13">+ status : tinyint(1)</text>
  <text x="760" y="265" font-family="Arial" font-size="13">+ category_id : int(11) FK</text>
  <text x="760" y="280" font-family="Arial" font-size="13">+ created_at : date</text>
  <text x="760" y="295" font-family="Arial" font-size="13">+ updated_at : date</text>
  
  <!-- Order Entity -->
  <rect x="1100" y="80" width="280" height="300" fill="#FFF2CC" stroke="black" stroke-width="2"/>
  <text x="1240" y="100" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Order</text>
  <line x1="1100" y1="110" x2="1380" y2="110" stroke="black" stroke-width="1"/>
  
  <text x="1110" y="130" font-family="Arial" font-size="13">+ id : int(11) PK</text>
  <text x="1110" y="145" font-family="Arial" font-size="13">+ fname : varchar(100)</text>
  <text x="1110" y="160" font-family="Arial" font-size="13">+ lname : varchar(100)</text>
  <text x="1110" y="175" font-family="Arial" font-size="13">+ email : varchar(100)</text>
  <text x="1110" y="190" font-family="Arial" font-size="13">+ phone : varchar(100)</text>
  <text x="1110" y="205" font-family="Arial" font-size="13">+ province : varchar(100)</text>
  <text x="1110" y="220" font-family="Arial" font-size="13">+ address : varchar(255)</text>
  <text x="1110" y="235" font-family="Arial" font-size="13">+ note : text</text>
  <text x="1110" y="250" font-family="Arial" font-size="13">+ delivery : varchar(100)</text>
  <text x="1110" y="265" font-family="Arial" font-size="13">+ payment : varchar(100)</text>
  <text x="1110" y="280" font-family="Arial" font-size="13">+ status : tinyint(1)</text>
  <text x="1110" y="295" font-family="Arial" font-size="13">+ account_id : int(11) FK</text>
  <text x="1110" y="310" font-family="Arial" font-size="13">+ coupon : float(9,3)</text>
  <text x="1110" y="325" font-family="Arial" font-size="13">+ payment_status : tinyint(1)</text>
  <text x="1110" y="340" font-family="Arial" font-size="13">+ created_at : date</text>
  <text x="1110" y="355" font-family="Arial" font-size="13">+ updated_at : date</text>
  
  <!-- OrderDetail Entity (Junction Table) -->
  <rect x="1450" y="80" width="280" height="140" fill="#E8F5E8" stroke="black" stroke-width="2"/>
  <text x="1590" y="100" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">OrderDetail</text>
  <line x1="1450" y1="110" x2="1730" y2="110" stroke="black" stroke-width="1"/>
  
  <text x="1460" y="130" font-family="Arial" font-size="13">+ order_id : int(11) FK</text>
  <text x="1460" y="145" font-family="Arial" font-size="13">+ product_id : int(11) FK</text>
  <text x="1460" y="160" font-family="Arial" font-size="13">+ quantity : int(11)</text>
  <text x="1460" y="175" font-family="Arial" font-size="13">+ price : float</text>
  
  <!-- Review Entity -->
  <rect x="400" y="320" width="280" height="180" fill="#FFF2CC" stroke="black" stroke-width="2"/>
  <text x="540" y="340" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Review</text>
  <line x1="400" y1="350" x2="680" y2="350" stroke="black" stroke-width="1"/>
  
  <text x="410" y="370" font-family="Arial" font-size="13">+ id : int(11) PK</text>
  <text x="410" y="385" font-family="Arial" font-size="13">+ rating : tinyint(4)</text>
  <text x="410" y="400" font-family="Arial" font-size="13">+ content : text</text>
  <text x="410" y="415" font-family="Arial" font-size="13">+ product_id : int(11) FK</text>
  <text x="410" y="430" font-family="Arial" font-size="13">+ account_id : int(11) FK</text>
  <text x="410" y="445" font-family="Arial" font-size="13">+ created_at : date</text>
  <text x="410" y="460" font-family="Arial" font-size="13">+ updated_at : date</text>
  
  <!-- Banner Entity -->
  <rect x="750" y="400" width="280" height="200" fill="#FFF2CC" stroke="black" stroke-width="2"/>
  <text x="890" y="420" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Banner</text>
  <line x1="750" y1="430" x2="1030" y2="430" stroke="black" stroke-width="1"/>
  
  <text x="760" y="450" font-family="Arial" font-size="13">+ id : int(11) PK</text>
  <text x="760" y="465" font-family="Arial" font-size="13">+ name : varchar(200)</text>
  <text x="760" y="480" font-family="Arial" font-size="13">+ image : varchar(200)</text>
  <text x="760" y="495" font-family="Arial" font-size="13">+ site : varchar(255)</text>
  <text x="760" y="510" font-family="Arial" font-size="13">+ description : varchar(255)</text>
  <text x="760" y="525" font-family="Arial" font-size="13">+ status : tinyint(1)</text>
  <text x="760" y="540" font-family="Arial" font-size="13">+ priority : tinyint(4)</text>
  <text x="760" y="555" font-family="Arial" font-size="13">+ created_at : date</text>
  <text x="760" y="570" font-family="Arial" font-size="13">+ updated_at : date</text>
  
  <!-- Coupon Entity -->
  <rect x="1100" y="440" width="280" height="160" fill="#FFF2CC" stroke="black" stroke-width="2"/>
  <text x="1240" y="460" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Coupon</text>
  <line x1="1100" y1="470" x2="1380" y2="470" stroke="black" stroke-width="1"/>
  
  <text x="1110" y="490" font-family="Arial" font-size="13">+ id : varchar(100) PK</text>
  <text x="1110" y="505" font-family="Arial" font-size="13">+ coupon_value : float(9,3)</text>
  <text x="1110" y="520" font-family="Arial" font-size="13">+ used_times : mediumint(8)</text>
  <text x="1110" y="535" font-family="Arial" font-size="13">+ status : tinyint(1)</text>
  <text x="1110" y="550" font-family="Arial" font-size="13">+ created_at : date</text>
  <text x="1110" y="565" font-family="Arial" font-size="13">+ updated_at : date</text>
  
  <!-- Contact Entity -->
  <rect x="1450" y="300" width="280" height="160" fill="#FFF2CC" stroke="black" stroke-width="2"/>
  <text x="1590" y="320" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Contact</text>
  <line x1="1450" y1="330" x2="1730" y2="330" stroke="black" stroke-width="1"/>
  
  <text x="1460" y="350" font-family="Arial" font-size="13">+ id : int(11) PK</text>
  <text x="1460" y="365" font-family="Arial" font-size="13">+ message : text</text>
  <text x="1460" y="380" font-family="Arial" font-size="13">+ name : varchar(100)</text>
  <text x="1460" y="395" font-family="Arial" font-size="13">+ email : varchar(150)</text>
  <text x="1460" y="410" font-family="Arial" font-size="13">+ phone : varchar(100)</text>
  <text x="1460" y="425" font-family="Arial" font-size="13">+ created_at : date</text>
  <text x="1460" y="440" font-family="Arial" font-size="13">+ updated_at : date</text>
  
  <!-- Blog Entity -->
  <rect x="50" y="420" width="280" height="200" fill="#FFF2CC" stroke="black" stroke-width="2"/>
  <text x="190" y="440" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Blog</text>
  <line x1="50" y1="450" x2="330" y2="450" stroke="black" stroke-width="1"/>
  
  <text x="60" y="470" font-family="Arial" font-size="13">+ id : int(11) PK</text>
  <text x="60" y="485" font-family="Arial" font-size="13">+ title : varchar(200)</text>
  <text x="60" y="500" font-family="Arial" font-size="13">+ image : varchar(200)</text>
  <text x="60" y="515" font-family="Arial" font-size="13">+ summary : varchar(255)</text>
  <text x="60" y="530" font-family="Arial" font-size="13">+ description : text</text>
  <text x="60" y="545" font-family="Arial" font-size="13">+ status : tinyint(1)</text>
  <text x="60" y="560" font-family="Arial" font-size="13">+ account_id : int(11) FK</text>
  <text x="60" y="575" font-family="Arial" font-size="13">+ created_at : date</text>
  <text x="60" y="590" font-family="Arial" font-size="13">+ updated_at : date</text>
  
  <!-- Comment Entity -->
  <rect x="50" y="680" width="280" height="160" fill="#FFF2CC" stroke="black" stroke-width="2"/>
  <text x="190" y="700" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Comment</text>
  <line x1="50" y1="710" x2="330" y2="710" stroke="black" stroke-width="1"/>
  
  <text x="60" y="730" font-family="Arial" font-size="13">+ id : int(11) PK</text>
  <text x="60" y="745" font-family="Arial" font-size="13">+ name : varchar(100)</text>
  <text x="60" y="760" font-family="Arial" font-size="13">+ email : varchar(150)</text>
  <text x="60" y="775" font-family="Arial" font-size="13">+ content : text</text>
  <text x="60" y="790" font-family="Arial" font-size="13">+ blog_id : int(11) FK</text>
  <text x="60" y="805" font-family="Arial" font-size="13">+ account_id : int(11) FK</text>
  
  <!-- UserCart Entity (Session-based) -->
  <rect x="400" y="560" width="280" height="140" fill="#E8F5E8" stroke="black" stroke-width="2"/>
  <text x="540" y="580" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">UserCart (Session)</text>
  <line x1="400" y1="590" x2="680" y2="590" stroke="black" stroke-width="1"/>
  
  <text x="410" y="610" font-family="Arial" font-size="13">+ session_id : string</text>
  <text x="410" y="625" font-family="Arial" font-size="13">+ product_id : int(11)</text>
  <text x="410" y="640" font-family="Arial" font-size="13">+ quantity : int</text>
  <text x="410" y="655" font-family="Arial" font-size="13">+ created_at : datetime</text>
  
  <!-- Relationships -->
  
  <!-- Category (1) to Product (many) -->
  <line x1="680" y1="170" x2="750" y2="190" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="705" y="165" font-family="Arial" font-size="12">1</text>
  <text x="725" y="185" font-family="Arial" font-size="12">*</text>
  <text x="700" y="175" font-family="Arial" font-size="12">has</text>
  
  <!-- Account (1) to Order (many) -->
  <line x1="330" y1="220" x2="1100" y2="220" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="350" y="215" font-family="Arial" font-size="12">1</text>
  <text x="1080" y="215" font-family="Arial" font-size="12">*</text>
  <text x="700" y="210" font-family="Arial" font-size="12">places</text>
  
  <!-- Order (1) to OrderDetail (many) -->
  <line x1="1380" y1="150" x2="1450" y2="150" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1390" y="145" font-family="Arial" font-size="12">1</text>
  <text x="1430" y="145" font-family="Arial" font-size="12">*</text>
  <text x="1405" y="135" font-family="Arial" font-size="12">contains</text>
  
  <!-- Product (1) to OrderDetail (many) -->
  <line x1="1030" y1="150" x2="1450" y2="150" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1050" y="145" font-family="Arial" font-size="12">1</text>
  <text x="1430" y="165" font-family="Arial" font-size="12">*</text>
  <text x="1220" y="135" font-family="Arial" font-size="12">ordered in</text>
  
  <!-- Product (1) to Review (many) -->
  <line x1="750" y1="300" x2="680" y2="400" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="725" y="295" font-family="Arial" font-size="12">1</text>
  <text x="685" y="395" font-family="Arial" font-size="12">*</text>
  <text x="710" y="350" font-family="Arial" font-size="12">reviewed by</text>
  
  <!-- Account (1) to Review (many) -->
  <line x1="330" y1="360" x2="400" y2="400" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="350" y="355" font-family="Arial" font-size="12">1</text>
  <text x="380" y="395" font-family="Arial" font-size="12">*</text>
  <text x="355" y="375" font-family="Arial" font-size="12">writes</text>
  
  <!-- Account (1) to Blog (many) -->
  <line x1="190" y1="360" x2="190" y2="420" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="200" y="375" font-family="Arial" font-size="12">1</text>
  <text x="200" y="415" font-family="Arial" font-size="12">*</text>
  <text x="210" y="390" font-family="Arial" font-size="12">authors</text>
  
  <!-- Blog (1) to Comment (many) -->
  <line x1="190" y1="620" x2="190" y2="680" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="200" y="635" font-family="Arial" font-size="12">1</text>
  <text x="200" y="675" font-family="Arial" font-size="12">*</text>
  <text x="210" y="650" font-family="Arial" font-size="12">has</text>
  
  <!-- Account (1) to Comment (many) -->
  <line x1="120" y1="360" x2="120" y2="680" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="130" y="375" font-family="Arial" font-size="12">1</text>
  <text x="130" y="675" font-family="Arial" font-size="12">*</text>
  <text x="140" y="520" font-family="Arial" font-size="12">comments</text>
  
  <!-- UserCart to Product (session-based relationship) -->
  <line x1="680" y1="620" x2="750" y2="300" stroke="black" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="700" y="615" font-family="Arial" font-size="12">*</text>
  <text x="730" y="305" font-family="Arial" font-size="12">1</text>
  <text x="710" y="460" font-family="Arial" font-size="12">stores</text>
  
  <!-- Legend -->
  <rect x="50" y="1000" width="400" height="200" fill="#F0F0F0" stroke="black" stroke-width="1"/>
  <text x="250" y="1020" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Chú thích</text>
  
  <text x="60" y="1040" font-family="Arial" font-size="13">PK = Primary Key</text>
  <text x="60" y="1055" font-family="Arial" font-size="13">FK = Foreign Key</text>
  <text x="60" y="1070" font-family="Arial" font-size="13">1 = One</text>
  <text x="60" y="1085" font-family="Arial" font-size="13">* = Many</text>
  
  <line x1="60" y1="1100" x2="100" y2="1100" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="110" y="1105" font-family="Arial" font-size="13">Quan hệ bắt buộc</text>
  
  <line x1="60" y1="1120" x2="100" y2="1120" stroke="black" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="110" y="1125" font-family="Arial" font-size="13">Quan hệ tùy chọn</text>
  
  <rect x="60" y="1140" width="50" height="30" fill="#FFF2CC" stroke="black" stroke-width="1"/>
  <text x="120" y="1155" font-family="Arial" font-size="13">Entity Class</text>
  
  <rect x="60" y="1175" width="50" height="30" fill="#E8F5E8" stroke="black" stroke-width="1"/>
  <text x="120" y="1190" font-family="Arial" font-size="13">Junction/Helper Class</text>
  
</svg>
