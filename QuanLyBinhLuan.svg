<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1500" height="1650" preserveAspectRatio="xMinYMin meet">
  <!-- Định nghĩa các đầu mũi tên -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
    <marker id="dashedarrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>
  
  <!-- Tiêu đề biểu đồ -->
  <text x="750" y="50" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Biểu đồ tuần tự: Quản lý Đánh giá</text>
  
  <!-- Admin -->
  <circle cx="160" cy="100" r="30" fill="#A9CCE3" stroke="black" stroke-width="2"/>
  <text x="160" y="140" font-family="Arial" font-size="16" text-anchor="middle">Admin</text>
  <line x1="160" y1="130" x2="160" y2="1600" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Các đối tượng (lifeline) -->
  <!-- frmQuanLyBinhLuan -->
  <circle cx="400" cy="100" r="30" fill="#AED6F1" stroke="black" stroke-width="2"/>
  <text x="400" y="150" font-family="Arial" font-size="16" text-anchor="middle">Giao diện Review</text>
  <line x1="400" y1="130" x2="400" y2="1600" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- CodeBinhLuan -->
  <circle cx="640" cy="100" r="30" fill="#AED6F1" stroke="black" stroke-width="2"/>
  <text x="640" y="150" font-family="Arial" font-size="16" text-anchor="middle">CodeBinhLuan</text>
  <line x1="640" y1="130" x2="640" y2="1600" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- tblBinhLuan -->
  <circle cx="880" cy="100" r="30" fill="#AED6F1" stroke="black" stroke-width="2"/>
  <text x="880" y="150" font-family="Arial" font-size="16" text-anchor="middle">tblBinhLuan</text>
  <line x1="880" y1="130" x2="880" y2="1600" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- tblSanPham -->
  <circle cx="1120" cy="100" r="30" fill="#AED6F1" stroke="black" stroke-width="2"/>
  <text x="1120" y="150" font-family="Arial" font-size="16" text-anchor="middle">tblSanPham</text>
  <line x1="1120" y1="130" x2="1120" y2="1600" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Thanh hoạt động cho Admin -->
  <rect x="155" y="200" width="10" height="1350" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 1. Truy cập trang quản lý bình luận -->
  <line x1="165" y1="230" x2="395" y2="230" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="220" font-family="Arial" font-size="16">Truy cập trang bình luận</text>
  
  <!-- Thanh hoạt động frmQuanLyBinhLuan -->
  <rect x="395" y="230" width="10" height="90" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 2. Hiển thị giao diện và gọi CodeBinhLuan -->
  <line x1="405" y1="270" x2="635" y2="270" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="260" font-family="Arial" font-size="16">Yêu cầu lấy danh sách bình luận</text>
  
  <!-- Thanh hoạt động CodeBinhLuan -->
  <rect x="635" y="270" width="10" height="190" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 3. CodeBinhLuan truy vấn dữ liệu từ tblBinhLuan -->
  <line x1="645" y1="310" x2="875" y2="310" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="760" y="300" font-family="Arial" font-size="16">Lấy danh sách bình luận từ CSDL</text>
  
  <!-- Thanh hoạt động tblBinhLuan -->
  <rect x="875" y="310" width="10" height="80" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 4. tblBinhLuan trả về kết quả -->
  <line x1="875" y1="390" x2="645" y2="390" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="760" y="380" font-family="Arial" font-size="16">Trả về danh sách bình luận</text>
  
  <!-- 5. CodeBinhLuan xử lý và phân trang -->
  <rect x="635" y="390" width="10" height="40" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  <text x="700" y="420" font-family="Arial" font-size="16" text-anchor="middle">Xử lý phân trang</text>
  
  <!-- 6. CodeBinhLuan trả về kết quả cho form -->
  <line x1="635" y1="460" x2="405" y2="460" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="520" y="450" font-family="Arial" font-size="16">Trả về danh sách bình luận đã phân trang</text>
  
  <!-- Thanh hoạt động frmQuanLyBinhLuan -->
  <rect x="395" y="460" width="10" height="50" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 7. Form hiển thị cho admin -->
  <line x1="395" y1="510" x2="165" y2="510" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="280" y="500" font-family="Arial" font-size="16">Hiển thị danh sách bình luận</text>
  
  <!-- 8. Admin chọn xem chi tiết bình luận sản phẩm -->
  <line x1="165" y1="560" x2="395" y2="560" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="550" font-family="Arial" font-size="16">Chọn xem chi tiết bình luận sản phẩm</text>
  
  <!-- Thanh hoạt động frmQuanLyBinhLuan -->
  <rect x="395" y="560" width="10" height="60" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 9. Form gửi yêu cầu xem chi tiết -->
  <line x1="405" y1="620" x2="635" y2="620" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="610" font-family="Arial" font-size="16">Gửi yêu cầu xem chi tiết (id sản phẩm)</text>
  
  <!-- Thanh hoạt động CodeBinhLuan -->
  <rect x="635" y="620" width="10" height="380" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 10. CodeBinhLuan lấy thông tin sản phẩm -->
  <line x1="645" y1="660" x2="1115" y2="660" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="880" y="650" font-family="Arial" font-size="16">Lấy thông tin sản phẩm từ CSDL</text>
  
  <!-- Thanh hoạt động tblSanPham -->
  <rect x="1115" y="660" width="10" height="60" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 11. tblSanPham trả về thông tin sản phẩm -->
  <line x1="1115" y1="720" x2="645" y2="720" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="880" y="710" font-family="Arial" font-size="16">Trả về thông tin sản phẩm</text>
  
  <!-- 12. CodeBinhLuan lấy bình luận theo sản phẩm -->
  <line x1="645" y1="770" x2="875" y2="770" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="760" y="760" font-family="Arial" font-size="16">Lấy bình luận theo sản phẩm từ CSDL</text>
  
  <!-- Thanh hoạt động tblBinhLuan -->
  <rect x="875" y="770" width="10" height="60" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 13. tblBinhLuan trả về danh sách bình luận -->
  <line x1="875" y1="830" x2="645" y2="830" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="760" y="820" font-family="Arial" font-size="16">Trả về danh sách bình luận theo sản phẩm</text>
  
  <!-- 14. CodeBinhLuan xử lý và phân trang -->
  <rect x="635" y="830" width="10" height="40" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  <text x="700" y="860" font-family="Arial" font-size="16" text-anchor="middle">Xử lý phân trang</text>
  
  <!-- 15. CodeBinhLuan trả về kết quả cho form -->
  <line x1="635" y1="900" x2="405" y2="900" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="520" y="890" font-family="Arial" font-size="16">Trả về chi tiết bình luận đã phân trang</text>
  
  <!-- Thanh hoạt động frmQuanLyBinhLuan -->
  <rect x="395" y="900" width="10" height="50" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 16. Form hiển thị chi tiết cho admin -->
  <line x1="395" y1="950" x2="165" y2="950" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="280" y="940" font-family="Arial" font-size="16">Hiển thị chi tiết bình luận sản phẩm</text>
  
  <!-- 17. Admin chọn xóa bình luận -->
  <line x1="165" y1="1000" x2="395" y2="1000" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="990" font-family="Arial" font-size="16">Chọn xóa bình luận</text>
  
  <!-- Thanh hoạt động frmQuanLyBinhLuan -->
  <rect x="395" y="1000" width="10" height="60" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 18. Form gửi yêu cầu xóa -->
  <line x1="405" y1="1060" x2="635" y2="1060" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="1050" font-family="Arial" font-size="16">Gửi yêu cầu xóa bình luận (id, pro_id)</text>
  
  <!-- Thanh hoạt động CodeBinhLuan -->
  <rect x="635" y="1060" width="10" height="150" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 19. CodeBinhLuan xóa từ tblBinhLuan -->
  <line x1="645" y1="1100" x2="875" y2="1100" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="760" y="1090" font-family="Arial" font-size="16">Xóa bình luận khỏi CSDL</text>
  
  <!-- Thanh hoạt động tblBinhLuan -->
  <rect x="875" y="1100" width="10" height="60" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 20. tblBinhLuan trả về kết quả xóa -->
  <line x1="875" y1="1160" x2="645" y2="1160" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="760" y="1150" font-family="Arial" font-size="16">Trả về kết quả xóa thành công</text>
  
  <!-- 21. CodeBinhLuan chuyển hướng về trang chi tiết -->
  <line x1="635" y1="1210" x2="405" y2="1210" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="520" y="1200" font-family="Arial" font-size="16">Chuyển hướng về trang chi tiết</text>
  
  <!-- Thanh hoạt động frmQuanLyBinhLuan -->
  <rect x="395" y="1210" width="10" height="50" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 22. Form hiển thị thông báo cho admin -->
  <line x1="395" y1="1260" x2="165" y2="1260" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="280" y="1250" font-family="Arial" font-size="16">Hiển thị thông báo xóa thành công</text>
  
  <!-- 23. Admin chọn duyệt bình luận -->
  <line x1="165" y1="1310" x2="395" y2="1310" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="1300" font-family="Arial" font-size="16">Chọn duyệt bình luận</text>
  
  <!-- Thanh hoạt động frmQuanLyBinhLuan -->
  <rect x="395" y="1310" width="10" height="60" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 24. Form gửi yêu cầu duyệt -->
  <line x1="405" y1="1370" x2="635" y2="1370" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="1360" font-family="Arial" font-size="16">Gửi yêu cầu duyệt bình luận (id)</text>
  
  <!-- Thanh hoạt động CodeBinhLuan -->
  <rect x="635" y="1370" width="10" height="150" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 25. CodeBinhLuan cập nhật trạng thái trong tblBinhLuan -->
  <line x1="645" y1="1410" x2="875" y2="1410" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="760" y="1400" font-family="Arial" font-size="16">Cập nhật trạng thái bình luận trong CSDL</text>
  
  <!-- Thanh hoạt động tblBinhLuan -->
  <rect x="875" y="1410" width="10" height="60" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 26. tblBinhLuan trả về kết quả cập nhật -->
  <line x1="875" y1="1470" x2="645" y2="1470" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="760" y="1460" font-family="Arial" font-size="16">Trả về kết quả cập nhật thành công</text>
  
  <!-- 27. CodeBinhLuan trả về kết quả cho form -->
  <line x1="635" y1="1520" x2="405" y2="1520" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="520" y="1510" font-family="Arial" font-size="16">Thông báo duyệt thành công</text>
  
  <!-- Thanh hoạt động frmQuanLyBinhLuan -->
  <rect x="395" y="1520" width="10" height="50" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 28. Form hiển thị thông báo cho admin -->
  <line x1="395" y1="1570" x2="165" y2="1570" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="280" y="1560" font-family="Arial" font-size="16">Hiển thị thông báo duyệt thành công</text>
</svg>
