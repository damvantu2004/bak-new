<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1300" height="1800" preserveAspectRatio="xMinYMin meet">
  <!-- Định nghĩa các đầu mũi tên -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
    <marker id="dashedarrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>
  
  <!-- Tiêu đề biểu đồ -->
  <text x="650" y="50" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Biểu đồ tuần tự: Quản lý đơn hàng</text>
  
  <!-- Admin -->
  <circle cx="160" cy="100" r="30" fill="#A9CCE3" stroke="black" stroke-width="2"/>
  <text x="160" y="150" font-family="Arial" font-size="16" text-anchor="middle">Admin</text>
  <line x1="160" y1="130" x2="160" y2="1750" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Các đối tượng (lifeline) -->
  <!-- frmOrderAdmin -->
  <circle cx="360" cy="100" r="30" fill="#AED6F1" stroke="black" stroke-width="2"/>
  <text x="360" y="150" font-family="Arial" font-size="16" text-anchor="middle">Giao diện đơn hàng</text>
  <line x1="360" y1="130" x2="360" y2="1750" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- CodeOrder -->
  <circle cx="560" cy="100" r="30" fill="#AED6F1" stroke="black" stroke-width="2"/>
  <text x="560" y="150" font-family="Arial" font-size="16" text-anchor="middle">CodeOrder</text>
  <line x1="560" y1="130" x2="560" y2="1750" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- tblOrder -->
  <circle cx="760" cy="100" r="30" fill="#AED6F1" stroke="black" stroke-width="2"/>
  <text x="760" y="150" font-family="Arial" font-size="16" text-anchor="middle">tblOrder</text>
  <line x1="760" y1="130" x2="760" y2="1750" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- tblOrderDetail -->
  <circle cx="960" cy="100" r="30" fill="#AED6F1" stroke="black" stroke-width="2"/>
  <text x="960" y="150" font-family="Arial" font-size="16" text-anchor="middle">tblOrderDetail</text>
  <line x1="960" y1="130" x2="960" y2="1750" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- tblProduct -->
  <circle cx="1160" cy="100" r="30" fill="#AED6F1" stroke="black" stroke-width="2"/>
  <text x="1160" y="150" font-family="Arial" font-size="16" text-anchor="middle">tblProduct</text>
  <line x1="1160" y1="130" x2="1160" y2="1750" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Thanh hoạt động cho Admin -->
  <rect x="155" y="200" width="10" height="1500" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 1. Truy cập trang đơn hàng -->
  <line x1="165" y1="230" x2="355" y2="230" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="220" font-family="Arial" font-size="14">Truy cập trang đơn hàng</text>
  
  <!-- Thanh hoạt động frmOrderAdmin -->
  <rect x="355" y="230" width="10" height="90" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 2. Hiển thị giao diện và gọi controller -->
  <line x1="365" y1="270" x2="555" y2="270" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="260" font-family="Arial" font-size="14">Yêu cầu lấy tất cả đơn hàng getAllOrderPaginate()</text>
  
  <!-- Thanh hoạt động CodeOrder -->
  <rect x="555" y="270" width="10" height="190" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 3. Truy vấn dữ liệu từ bảng order -->
  <line x1="565" y1="310" x2="755" y2="310" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="660" y="300" font-family="Arial" font-size="14">Truy vấn dữ liệu đơn hàng</text>
  
  <!-- Thanh hoạt động tblOrder -->
  <rect x="755" y="310" width="10" height="90" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 4. Trả về dữ liệu đơn hàng -->
  <line x1="755" y1="400" x2="565" y2="400" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="660" y="390" font-family="Arial" font-size="14">Trả về dữ liệu đơn hàng</text>
  
  <!-- 5. Hiển thị danh sách đơn hàng -->
  <line x1="555" y1="430" x2="365" y2="430" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="460" y="420" font-family="Arial" font-size="14">Render admin.order.index</text>
  
  <!-- 6. Form hiển thị cho admin -->
  <rect x="355" y="430" width="10" height="50" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  <line x1="355" y1="480" x2="165" y2="480" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="260" y="470" font-family="Arial" font-size="14">Hiển thị danh sách đơn hàng</text>
  
  <!-- 7. Admin chọn xem chi tiết đơn hàng -->
  <line x1="165" y1="520" x2="355" y2="520" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="510" font-family="Arial" font-size="14">Xem chi tiết đơn hàng</text>
  
  <!-- Thanh hoạt động frmOrderAdmin -->
  <rect x="355" y="520" width="10" height="60" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 8. Gọi controller để xem chi tiết -->
  <line x1="365" y1="560" x2="555" y2="560" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="550" font-family="Arial" font-size="14">detail(id)</text>
  
  <!-- Thanh hoạt động CodeOrder -->
  <rect x="555" y="560" width="10" height="240" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 9. Truy vấn thông tin đơn hàng -->
  <line x1="565" y1="600" x2="755" y2="600" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="660" y="590" font-family="Arial" font-size="14">getOrderDetailById(id)</text>
  
  <!-- Thanh hoạt động tblOrder -->
  <rect x="755" y="600" width="10" height="60" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 10. Trả về thông tin đơn hàng -->
  <line x1="755" y1="660" x2="565" y2="660" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="660" y="650" font-family="Arial" font-size="14">Trả về thông tin đơn hàng</text>
  
  <!-- 11. Truy vấn chi tiết đơn hàng -->
  <line x1="565" y1="700" x2="955" y2="700" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="760" y="690" font-family="Arial" font-size="14">getAllProductsInOrderById(id)</text>
  
  <!-- Thanh hoạt động tblOrderDetail -->
  <rect x="955" y="700" width="10" height="60" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 12. Trả về chi tiết đơn hàng -->
  <line x1="955" y1="760" x2="565" y2="760" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="760" y="750" font-family="Arial" font-size="14">Trả về chi tiết đơn hàng</text>
  
  <!-- 13. Hiển thị chi tiết đơn hàng -->
  <line x1="555" y1="800" x2="365" y2="800" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="460" y="790" font-family="Arial" font-size="14">Render admin.order.detail</text>
  
  <!-- 14. Form hiển thị chi tiết cho admin -->
  <rect x="355" y="800" width="10" height="50" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  <line x1="355" y1="850" x2="165" y2="850" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="260" y="840" font-family="Arial" font-size="14">Hiển thị chi tiết đơn hàng</text>
  
  <!-- 15. Admin cập nhật trạng thái đơn hàng -->
  <line x1="165" y1="890" x2="355" y2="890" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="880" font-family="Arial" font-size="14">Cập nhật trạng thái đơn hàng</text>
  
  <!-- Thanh hoạt động frmOrderAdmin -->
  <rect x="355" y="890" width="10" height="60" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 16. Gọi controller để cập nhật -->
  <line x1="365" y1="930" x2="555" y2="930" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="920" font-family="Arial" font-size="14">update(id, status)</text>
  
  <!-- Thanh hoạt động CodeOrder -->
  <rect x="555" y="930" width="10" height="320" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 17. Lấy trạng thái cũ của đơn hàng -->
  <line x1="565" y1="970" x2="755" y2="970" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="660" y="960" font-family="Arial" font-size="14">getOrderDetailById(id)</text>
  
  <!-- Thanh hoạt động tblOrder -->
  <rect x="755" y="970" width="10" height="60" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 18. Trả về trạng thái cũ -->
  <line x1="755" y1="1030" x2="565" y2="1030" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="660" y="1020" font-family="Arial" font-size="14">Trả về trạng thái cũ</text>
  
  <!-- 19. Cập nhật trạng thái mới -->
  <line x1="565" y1="1070" x2="755" y2="1070" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="660" y="1060" font-family="Arial" font-size="14">updateData(id, data)</text>
  
  <!-- Thanh hoạt động tblOrder -->
  <rect x="755" y="1070" width="10" height="60" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 20. Trả về kết quả cập nhật -->
  <line x1="755" y1="1130" x2="565" y2="1130" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="660" y="1120" font-family="Arial" font-size="14">Trả về kết quả cập nhật</text>
  
  <!-- 21. Gửi email thông báo nếu trạng thái thay đổi -->
  <rect x="555" y="1130" width="10" height="60" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  <text x="650" y="1160" font-family="Arial" font-size="14" text-anchor="middle">Gửi email thông báo</text>
  
  <!-- 22. Chuyển hướng về trang chi tiết -->
  <line x1="555" y1="1250" x2="365" y2="1250" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="460" y="1240" font-family="Arial" font-size="14">Chuyển hướng về trang chi tiết</text>
  
  <!-- 23. Form hiển thị chi tiết đã cập nhật -->
  <rect x="355" y="1250" width="10" height="50" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  <line x1="355" y1="1300" x2="165" y2="1300" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="260" y="1290" font-family="Arial" font-size="14">Hiển thị chi tiết đã cập nhật</text>
  
  <!-- 24. Admin in hóa đơn -->
  <line x1="165" y1="1340" x2="355" y2="1340" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="1330" font-family="Arial" font-size="14">Yêu cầu in hóa đơn</text>
  
  <!-- Thanh hoạt động frmOrderAdmin -->
  <rect x="355" y="1340" width="10" height="60" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 25. Gọi controller để in hóa đơn -->
  <line x1="365" y1="1380" x2="555" y2="1380" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="1370" font-family="Arial" font-size="14">printInvoice(id)</text>
  
  <!-- Thanh hoạt động CodeOrder -->
  <rect x="555" y="1380" width="10" height="240" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 26. Truy vấn thông tin đơn hàng -->
  <line x1="565" y1="1420" x2="755" y2="1420" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="660" y="1410" font-family="Arial" font-size="14">getOrderDetailById(id)</text>
  
  <!-- Thanh hoạt động tblOrder -->
  <rect x="755" y="1420" width="10" height="60" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 27. Trả về thông tin đơn hàng -->
  <line x1="755" y1="1480" x2="565" y2="1480" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="660" y="1470" font-family="Arial" font-size="14">Trả về thông tin đơn hàng</text>
  
  <!-- 28. Truy vấn chi tiết đơn hàng -->
  <line x1="565" y1="1520" x2="955" y2="1520" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="760" y="1510" font-family="Arial" font-size="14">getAllProductsInOrderById(id)</text>
  
  <!-- Thanh hoạt động tblOrderDetail -->
  <rect x="955" y="1520" width="10" height="60" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 29. Trả về chi tiết đơn hàng -->
  <line x1="955" y1="1580" x2="565" y2="1580" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="760" y="1570" font-family="Arial" font-size="14">Trả về chi tiết đơn hàng</text>
  
  <!-- 30. Hiển thị hóa đơn -->
  <line x1="555" y1="1620" x2="365" y2="1620" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="460" y="1610" font-family="Arial" font-size="14">Render admin.order.invoice</text>
  
  <!-- 31. Form hiển thị hóa đơn cho admin -->
  <rect x="355" y="1620" width="10" height="50" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  <line x1="355" y1="1670" x2="165" y2="1670" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="260" y="1660" font-family="Arial" font-size="14">Hiển thị hóa đơn để in</text>
</svg>
