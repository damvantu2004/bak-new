<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1500" height="1500" viewBox="0 0 1500 1200" preserveAspectRatio="xMinYMin meet">
  <!-- Định nghĩa các đầu mũi tên -->
  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="2" refY="6" orient="auto">
      <path d="M2,2 L2,11 L10,6 L2,2" style="fill:black;" />
    </marker>
    
    <marker id="dashedarrow" markerWidth="13" markerHeight="13" refX="2" refY="6" orient="auto">
