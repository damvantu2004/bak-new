<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="auto" viewBox="0 0 1400 900" preserveAspectRatio="xMinYMin meet">
  <!-- Định nghĩa các đầu mũi tên -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
    <marker id="dashedarrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>
  
  <!-- Tiêu đề biểu đồ -->
  <text x="700" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Biểu đồ tuần tự: Chỉnh sửa dữ liệu</text>
  
  <!-- Admin -->
  <rect x="80" y="80" width="100" height="50" fill="#A9CCE3" stroke="black" stroke-width="2"/>
  <text x="130" y="110" font-family="Arial" font-size="13" text-anchor="middle">Admin</text>
  <line x1="130" y1="130" x2="130" y2="850" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Giao diện -->
  <circle cx="350" cy="100" r="25" fill="#AED6F1" stroke="black" stroke-width="2"/>
  <text x="350" y="150" font-family="Arial" font-size="13" text-anchor="middle">Giao diện</text>
  <line x1="350" y1="125" x2="350" y2="850" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- CodeX -->
  <circle cx="650" cy="100" r="25" fill="#F9E79F" stroke="black" stroke-width="2"/>
  <text x="650" y="150" font-family="Arial" font-size="13" text-anchor="middle">CodeX</text>
  <line x1="650" y1="125" x2="650" y2="850" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- tblData -->
  <circle cx="950" cy="100" r="25" fill="#ABEBC6" stroke="black" stroke-width="2"/>
  <text x="950" y="150" font-family="Arial" font-size="13" text-anchor="middle">tblData</text>
  <line x1="950" y1="125" x2="950" y2="850" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- tblRelated -->
  <circle cx="1250" cy="100" r="25" fill="#D5DBDB" stroke="black" stroke-width="2"/>
  <text x="1250" y="150" font-family="Arial" font-size="13" text-anchor="middle">tblRelated</text>
  <line x1="1250" y1="125" x2="1250" y2="850" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Thanh hoạt động cho Admin -->
  <rect x="125" y="180" width="10" height="620" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 1. Admin chọn chỉnh sửa -->
  <line x1="135" y1="200" x2="345" y2="200" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="240" y="190" font-family="Arial" font-size="13">Chọn chỉnh sửa (ID)</text>
  
  <!-- Thanh hoạt động Giao diện -->
  <rect x="345" y="200" width="10" height="60" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 2. Yêu cầu lấy dữ liệu -->
  <line x1="355" y1="230" x2="645" y2="230" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="220" font-family="Arial" font-size="13">Yêu cầu lấy dữ liệu theo ID</text>
  
  <!-- Thanh hoạt động CodeX -->
  <rect x="645" y="230" width="10" height="160" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 3. Lấy dữ liệu hiện tại -->
  <line x1="655" y1="260" x2="945" y2="260" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="800" y="250" font-family="Arial" font-size="13">Lấy dữ liệu theo ID</text>
  
  <!-- Thanh hoạt động tblData -->
  <rect x="945" y="260" width="10" height="40" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 4. Trả về dữ liệu hiện tại -->
  <line x1="945" y1="300" x2="655" y2="300" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="800" y="290" font-family="Arial" font-size="13">Trả về dữ liệu hiện tại</text>
  
  <!-- 5. Lấy dữ liệu liên quan -->
  <line x1="655" y1="330" x2="1245" y2="330" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="950" y="320" font-family="Arial" font-size="13">Lấy dữ liệu liên quan</text>
  
  <!-- Thanh hoạt động tblRelated -->
  <rect x="1245" y="330" width="10" height="40" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 6. Trả về dữ liệu liên quan -->
  <line x1="1245" y1="370" x2="655" y2="370" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="950" y="360" font-family="Arial" font-size="13">Trả về dữ liệu liên quan</text>
  
  <!-- 7. Trả về form chỉnh sửa -->
  <line x1="645" y1="400" x2="355" y2="400" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="500" y="390" font-family="Arial" font-size="13">Trả về form chỉnh sửa</text>
  
  <!-- 8. Hiển thị form với dữ liệu -->
  <line x1="345" y1="430" x2="135" y2="430" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="240" y="420" font-family="Arial" font-size="13">Hiển thị form với dữ liệu</text>
  
  <!-- 9. Admin sửa thông tin và submit -->
  <line x1="135" y1="470" x2="345" y2="470" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="240" y="460" font-family="Arial" font-size="13">Sửa thông tin và submit</text>
  
  <!-- Thanh hoạt động Giao diện -->
  <rect x="345" y="470" width="10" height="60" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 10. Gửi dữ liệu đã sửa -->
  <line x1="355" y1="500" x2="645" y2="500" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="490" font-family="Arial" font-size="13">Gửi dữ liệu đã sửa</text>
  
  <!-- Thanh hoạt động CodeX -->
  <rect x="645" y="500" width="10" height="200" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 11. Xử lý và validate dữ liệu -->
  <line x1="645" y1="520" x2="645" y2="540" stroke="black" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="700" y="530" font-family="Arial" font-size="13">Xử lý và validate</text>
  
  <!-- 12. Kiểm tra dữ liệu trùng lặp -->
  <line x1="655" y1="560" x2="945" y2="560" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="800" y="550" font-family="Arial" font-size="13">Kiểm tra trùng lặp</text>
  
  <!-- Thanh hoạt động tblData -->
  <rect x="945" y="560" width="10" height="40" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 13. Trả về kết quả kiểm tra -->
  <line x1="945" y1="600" x2="655" y2="600" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="800" y="590" font-family="Arial" font-size="13">Trả về kết quả kiểm tra</text>
  
  <!-- 14. Cập nhật dữ liệu -->
  <line x1="655" y1="630" x2="945" y2="630" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="800" y="620" font-family="Arial" font-size="13">Cập nhật dữ liệu</text>
  
  <!-- Thanh hoạt động tblData -->
  <rect x="945" y="630" width="10" height="40" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 15. Xác nhận cập nhật thành công -->
  <line x1="945" y1="670" x2="655" y2="670" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="800" y="660" font-family="Arial" font-size="13">Xác nhận cập nhật thành công</text>
  
  <!-- 16. Trả về kết quả -->
  <line x1="645" y1="700" x2="355" y2="700" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="500" y="690" font-family="Arial" font-size="13">Trả về thông báo thành công</text>
  
  <!-- Thanh hoạt động Giao diện -->
  <rect x="345" y="700" width="10" height="40" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 17. Hiển thị thông báo -->
  <line x1="345" y1="740" x2="135" y2="740" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="240" y="730" font-family="Arial" font-size="13">Hiển thị thông báo thành công</text>
  
</svg>
