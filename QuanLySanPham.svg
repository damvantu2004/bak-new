<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="auto" viewBox="0 0 1500 1200" preserveAspectRatio="xMinYMin meet">
  <!-- Định nghĩa các đầu mũi tên -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
    <marker id="dashedarrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>
  
  <!-- Tiêu đề biểu đồ -->
  <text x="700" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Biểu đồ tuần tự: Quản lý sản phẩm (Product)</text>
  
  <!-- Nhân viên (Admin) -->
  <rect x="150" y="80" width="100" height="50" fill="#A9CCE3" stroke="black" stroke-width="2"/>
  <text x="200" y="110" font-family="Arial" font-size="16" text-anchor="middle">Admin</text>
  <line x1="200" y1="130" x2="200" y2="1150" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Các đối tượng (lifeline) -->
  <!-- frmProductAdmin -->
  <circle cx="450" cy="100" r="25" fill="#AED6F1" stroke="black" stroke-width="2"/>
  <text x="450" y="145" font-family="Arial" font-size="16" text-anchor="middle">Giao diện Product</text>
  <line x1="450" y1="125" x2="450" y2="1150" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- ProductController -->
  <circle cx="750" cy="100" r="25" fill="#AED6F1" stroke="black" stroke-width="2"/>
  <text x="750" y="145" font-family="Arial" font-size="16" text-anchor="middle">ProductController</text>
  <line x1="750" y1="125" x2="750" y2="1150" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- ProductModel -->
  <circle cx="1050" cy="100" r="25" fill="#AED6F1" stroke="black" stroke-width="2"/>
  <text x="1050" y="145" font-family="Arial" font-size="16" text-anchor="middle">ProductModel</text>
  <line x1="1050" y1="125" x2="1050" y2="1150" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Database -->
  <circle cx="1350" cy="100" r="25" fill="#D5F5E3" stroke="black" stroke-width="2"/>
  <text x="1350" y="145" font-family="Arial" font-size="16" text-anchor="middle">Database</text>
  <line x1="1350" y1="130" x2="1350" y2="1150" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Thanh hoạt động cho Admin -->
  <rect x="195" y="180" width="10" height="900" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 1. Truy cập trang sản phẩm -->
  <line x1="205" y1="200" x2="445" y2="200" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="325" y="190" font-family="Arial" font-size="16">Truy cập trang sản phẩm</text>
  
  <!-- Thanh hoạt động frmProductAdmin -->
  <rect x="445" y="200" width="10" height="80" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 2. Hiển thị giao diện và gọi controller -->
  <line x1="455" y1="230" x2="745" y2="230" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="220" font-family="Arial" font-size="16">Yêu cầu hiển thị giao diện</text>
  
  <!-- Thanh hoạt động ProductController -->
  <rect x="745" y="230" width="10" height="100" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 3. Controller lấy danh sách sản phẩm -->
  <line x1="755" y1="260" x2="1045" y2="260" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="900" y="250" font-family="Arial" font-size="16">Lấy danh sách sản phẩm</text>
  
  <!-- Thanh hoạt động ProductModel -->
  <rect x="1045" y="260" width="10" height="70" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- ProductModel truy vấn database -->
  <rect x="1345" y="260" width="10" height="70" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  <line x1="1055" y1="280" x2="1345" y2="280" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1200" y="270" font-family="Arial" font-size="16">Truy vấn danh sách sản phẩm</text>
  
  <!-- Database trả về kết quả -->
  <line x1="1345" y1="310" x2="1055" y2="310" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="1200" y="300" font-family="Arial" font-size="16">Trả về danh sách sản phẩm</text>
  
  <!-- 4. Trả về danh sách sản phẩm -->
  <line x1="1045" y1="330" x2="755" y2="330" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="900" y="320" font-family="Arial" font-size="16">Trả về kết quả</text>
  
  <!-- 5. Render view với danh sách sản phẩm -->
  <line x1="745" y1="360" x2="445" y2="360" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="595" y="350" font-family="Arial" font-size="16">Render view với danh sách sản phẩm</text>
  
  <!-- Thanh hoạt động frmProductAdmin -->
  <rect x="445" y="360" width="10" height="40" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 6. Hiển thị danh sách sản phẩm cho admin -->
  <line x1="445" y1="400" x2="205" y2="400" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="325" y="390" font-family="Arial" font-size="16">Hiển thị danh sách sản phẩm</text>
  
  <!-- 7. Admin chọn thêm sản phẩm mới -->
  <line x1="205" y1="440" x2="445" y2="440" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="325" y="430" font-family="Arial" font-size="16">Chọn thêm sản phẩm mới</text>
  
  <!-- Thanh hoạt động frmProductAdmin -->
  <rect x="445" y="440" width="10" height="80" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 8. Form gọi controller hiển thị form thêm -->
  <line x1="455" y1="470" x2="745" y2="470" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="460" font-family="Arial" font-size="16">create()</text>
  
  <!-- Thanh hoạt động ProductController -->
  <rect x="745" y="470" width="10" height="100" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 9. Controller lấy danh sách danh mục -->
  <line x1="755" y1="490" x2="1045" y2="490" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="900" y="480" font-family="Arial" font-size="16">Lấy danh sách danh mục</text>
  
  <!-- Thanh hoạt động CategoryModel (thông qua ProductModel) -->
  <rect x="1045" y="490" width="10" height="50" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 10. Trả về danh sách danh mục -->
  <line x1="1045" y1="540" x2="755" y2="540" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="900" y="530" font-family="Arial" font-size="16">Trả về danh sách danh mục</text>
  
  <!-- 11. Controller render form thêm sản phẩm -->
  <line x1="745" y1="570" x2="445" y2="570" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="595" y="560" font-family="Arial" font-size="16">Trả về giao diện thêm sản phẩm</text>
  
  <!-- Thanh hoạt động frmProductAdmin -->
  <rect x="445" y="570" width="10" height="40" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 12. Hiển thị form thêm sản phẩm -->
  <line x1="445" y1="610" x2="205" y2="610" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="325" y="600" font-family="Arial" font-size="16">Hiển thị form thêm sản phẩm</text>
  
  <!-- 13. Admin nhập thông tin và submit -->
  <line x1="205" y1="650" x2="445" y2="650" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="325" y="640" font-family="Arial" font-size="16">Nhập thông tin và submit</text>
  
  <!-- Thanh hoạt động frmProductAdmin -->
  <rect x="445" y="650" width="10" height="80" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 14. Form gọi controller lưu sản phẩm -->
  <line x1="455" y1="680" x2="745" y2="680" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="670" font-family="Arial" font-size="16">Lưu sản phẩm</text>
  
  <!-- Thanh hoạt động ProductController -->
  <rect x="745" y="680" width="10" height="200" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 15. Controller xử lý upload ảnh -->
  <line x1="745" y1="700" x2="745" y2="720" stroke="black" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="800" y="710" font-family="Arial" font-size="16">getImage()</text>
  
  <!-- 16. Controller kiểm tra tên sản phẩm đã tồn tại -->
  <line x1="755" y1="740" x2="1045" y2="740" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="900" y="730" font-family="Arial" font-size="16">Kiểm tra sản phẩm đã tồn tại findProductByName()</text>
  
  <!-- Thanh hoạt động ProductModel -->
  <rect x="1045" y="740" width="10" height="70" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- ProductModel truy vấn database -->
  <rect x="1345" y="740" width="10" height="70" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  <line x1="1055" y1="760" x2="1345" y2="760" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1200" y="750" font-family="Arial" font-size="16">Kiểm tra tên sản phẩm</text>
  
  <!-- Database trả về kết quả -->
  <line x1="1345" y1="790" x2="1055" y2="790" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="1200" y="780" font-family="Arial" font-size="16">Trả về kết quả kiểm tra</text>
  
  <!-- 17. Trả về kết quả kiểm tra -->
  <line x1="1045" y1="810" x2="755" y2="810" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="900" y="800" font-family="Arial" font-size="16">Trả về kết quả</text>
  
  <!-- 18. Controller lưu sản phẩm mới -->
  <line x1="755" y1="840" x2="1045" y2="840" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="900" y="830" font-family="Arial" font-size="16">createData()</text>
  
  <!-- Thanh hoạt động ProductModel -->
  <rect x="1045" y="840" width="10" height="70" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- ProductModel lưu vào database -->
  <rect x="1345" y="840" width="10" height="70" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  <line x1="1055" y1="860" x2="1345" y2="860" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1200" y="850" font-family="Arial" font-size="16">Lưu sản phẩm mới</text>
  
  <!-- Database xác nhận -->
  <line x1="1345" y1="890" x2="1055" y2="890" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="1200" y="880" font-family="Arial" font-size="16">Xác nhận lưu thành công</text>
  
  <!-- 19. Trả về kết quả lưu -->
  <line x1="1045" y1="910" x2="755" y2="910" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="900" y="900" font-family="Arial" font-size="16">Trả về kết quả</text>
  
  <!-- 20. Controller render form với thông báo thành công -->
  <line x1="745" y1="940" x2="445" y2="940" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="595" y="930" font-family="Arial" font-size="16">Trả về view với thông báo</text>
  
  <!-- Thanh hoạt động frmProductAdmin -->
  <rect x="445" y="940" width="10" height="40" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 21. Hiển thị thông báo thành công -->
  <line x1="445" y1="980" x2="205" y2="980" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="325" y="970" font-family="Arial" font-size="16">Hiển thị thông báo thành công</text>
  
  <!-- 22. Admin tìm kiếm sản phẩm -->
  <line x1="205" y1="1020" x2="445" y2="1020" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="325" y="1010" font-family="Arial" font-size="16">Tìm kiếm sản phẩm</text>
  
  <!-- Thanh hoạt động frmProductAdmin -->
  <rect x="445" y="1020" width="10" height="80" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 23. Form gọi controller tìm kiếm -->
  <line x1="455" y1="1050" x2="745" y2="1050" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="1040" font-family="Arial" font-size="16">searchProductFull()</text>
  
  <!-- Thanh hoạt động ProductController -->
  <rect x="745" y="1050" width="10" height="100" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 24. Controller tìm kiếm sản phẩm -->
  <line x1="755" y1="1080" x2="1045" y2="1080" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="900" y="1070" font-family="Arial" font-size="16">searchProductFull()</text>
  
  <!-- Thanh hoạt động ProductModel -->
  <rect x="1045" y="1080" width="10" height="70" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- ProductModel truy vấn database -->
  <rect x="1345" y="1080" width="10" height="70" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  <line x1="1055" y1="1100" x2="1345" y2="1100" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1200" y="1090" font-family="Arial" font-size="16">Tìm kiếm sản phẩm</text>
  
  <!-- Database trả về kết quả -->
  <line x1="1345" y1="1130" x2="1055" y2="1130" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="1200" y="1120" font-family="Arial" font-size="16">Trả về kết quả tìm kiếm</text>
</svg>

