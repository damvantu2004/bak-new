  <rect x="1010" y="250" width="280" height="130" fill="#F3E5F5" stroke="black" stroke-width="2"/>
  <text x="1150" y="270" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">BannerController</text>
  <line x1="1010" y1="280" x2="1290" y2="280" stroke="black" stroke-width="1"/>
  
  <text x="1020" y="300" font-family="Arial" font-size="13">+ index()</text>
  <text x="1020" y="315" font-family="Arial" font-size="13">+ create()</text>
  <text x="1020" y="330" font-family="Arial" font-size="13">+ store()</text>
  <text x="1020" y="345" font-family="Arial" font-size="13">+ edit(id)</text>
  <text x="1020" y="360" font-family="Arial" font-size="13">+ update(id)</text>
  <text x="1020" y="375" font-family="Arial" font-size="13">+ delete(id)</text>
  
  <!-- ReviewController -->
  <rect x="50" y="440" width="280" height="110" fill="#F3E5F5" stroke="black" stroke-width="2"/>
  <text x="190" y="460" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">ReviewController</text>
  <line x1="50" y1="470" x2="330" y2="470" stroke="black" stroke-width="1"/>
  
  <text x="60" y="490" font-family="Arial" font-size="13">+ index()</text>
  <text x="60" y="505" font-family="Arial" font-size="13">+ show(id)</text>
  <text x="60" y="520" font-family="Arial" font-size="13">+ delete(id)</text>
  <text x="60" y="535" font-family="Arial" font-size="13">+ approve(id)</text>
  
  <!-- CouponController -->
  <rect x="370" y="440" width="280" height="130" fill="#F3E5F5" stroke="black" stroke-width="2"/>
  <text x="510" y="460" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">CouponController</text>
  <line x1="370" y1="470" x2="650" y2="470" stroke="black" stroke-width="1"/>
  
  <text x="380" y="490" font-family="Arial" font-size="13">+ index()</text>
  <text x="380" y="505" font-family="Arial" font-size="13">+ create()</text>
  <text x="380" y="520" font-family="Arial" font-size="13">+ store()</text>
  <text x="380" y="535" font-family="Arial" font-size="13">+ edit(id)</text>
  <text x="380" y="550" font-family="Arial" font-size="13">+ update(id)</text>
  <text x="380" y="565" font-family="Arial" font-size="13">+ delete(id)</text>
  
  <!-- AccountController -->
  <rect x="690" y="440" width="280" height="130" fill="#F3E5F5" stroke="black" stroke-width="2"/>
  <text x="830" y="460" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">AccountController</text>
  <line x1="690" y1="470" x2="970" y2="470" stroke="black" stroke-width="1"/>
  
  <text x="700" y="490" font-family="Arial" font-size="13">+ index()</text>
  <text x="700" y="505" font-family="Arial" font-size="13">+ show(id)</text>
  <text x="700" y="520" font-family="Arial" font-size="13">+ edit(id)</text>
  <text x="700" y="535" font-family="Arial" font-size="13">+ update(id)</text>
  <text x="700" y="550" font-family="Arial" font-size="13">+ delete(id)</text>
  <text x="700" y="565" font-family="Arial" font-size="13">+ changeStatus(id)</text>
  
  <!-- ContactController -->
  <rect x="1010" y="440" width="280" height="110" fill="#F3E5F5" stroke="black" stroke-width="2"/>
  <text x="1150" y="460" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">ContactController</text>
  <line x1="1010" y1="470" x2="1290" y2="470" stroke="black" stroke-width="1"/>
  
  <text x="1020" y="490" font-family="Arial" font-size="13">+ index()</text>
  <text x="1020" y="505" font-family="Arial" font-size="13">+ show(id)</text>
  <text x="1020" y="520" font-family="Arial" font-size="13">+ delete(id)</text>
  <text x="1020" y="535" font-family="Arial" font-size="13">+ reply(id)</text>
  
  <!-- DashboardController -->
  <rect x="1330" y="250" width="280" height="110" fill="#F3E5F5" stroke="black" stroke-width="2"/>
  <text x="1470" y="270" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">DashboardController</text>
  <line x1="1330" y1="280" x2="1610" y2="280" stroke="black" stroke-width="1"/>
  
  <text x="1340" y="300" font-family="Arial" font-size="13">+ index()</text>
  <text x="1340" y="315" font-family="Arial" font-size="13">+ getStatistics()</text>
  <text x="1340" y="330" font-family="Arial" font-size="13">+ getChartData()</text>
  <text x="1340" y="345" font-family="Arial" font-size="13">+ exportReport()</text>
  
  <!-- Inheritance Arrows -->
  <!-- ProductController extends BaseController -->
  <line x1="190" y1="250" x2="750" y2="200" stroke="black" stroke-width="2" marker-end="url(#inheritance)"/>
  
  <!-- CategoryController extends BaseController -->
  <line x1="510" y1="250" x2="780" y2="200" stroke="black" stroke-width="2" marker-end="url(#inheritance)"/>
  
  <!-- OrderController extends BaseController -->
  <line x1="830" y1="250" x2="800" y2="200" stroke="black" stroke-width="2" marker-end="url(#inheritance)"/>
  
  <!-- BannerController extends BaseController -->
  <line x1="1150" y1="250" x2="850" y2="200" stroke="black" stroke-width="2" marker-end="url(#inheritance)"/>
  
  <!-- ReviewController extends BaseController -->
  <line x1="190" y1="440" x2="750" y2="200" stroke="black" stroke-width="2" marker-end="url(#inheritance)"/>
  
  <!-- CouponController extends BaseController -->
  <line x1="510" y1="440" x2="780" y2="200" stroke="black" stroke-width="2" marker-end="url(#inheritance)"/>
  
  <!-- AccountController extends BaseController -->
  <line x1="830" y1="440" x2="800" y2="200" stroke="black" stroke-width="2" marker-end="url(#inheritance)"/>
  
  <!-- ContactController extends BaseController -->
  <line x1="1150" y1="440" x2="850" y2="200" stroke="black" stroke-width="2" marker-end="url(#inheritance)"/>
  
  <!-- DashboardController extends BaseController -->
  <line x1="1470" y1="250" x2="880" y2="200" stroke="black" stroke-width="2" marker-end="url(#inheritance)"/>
  
  <!-- Marker definitions -->
  <defs>
    <marker id="inheritance" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto">
      <polygon points="0,0 0,12 12,6" fill="white" stroke="black" stroke-width="1"/>
    </marker>
  </defs>
  
</svg>
