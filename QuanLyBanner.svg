<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1500" height="1650" preserveAspectRatio="xMinYMin meet">
  <!-- Định nghĩa các đầu mũi tên -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
    <marker id="dashedarrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>
  
  <!-- Tiêu đề biểu đồ -->
  <text x="750" y="50" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Biểu đồ tuần tự: Quản lý Banner</text>
  
  <!-- Admin -->
  <circle cx="160" cy="100" r="30" fill="#A9CCE3" stroke="black" stroke-width="2"/>
  <text x="160" y="150" font-family="Arial" font-size="16" text-anchor="middle">Admin</text>
  <line x1="160" y1="130" x2="160" y2="1600" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Các đối tượng (lifeline) -->
  <!-- frmQuanLyBanner -->
  <circle cx="400" cy="100" r="30" fill="#AED6F1" stroke="black" stroke-width="2"/>
  <text x="400" y="150" font-family="Arial" font-size="16" text-anchor="middle">Giao diện Banner</text>
  <line x1="400" y1="130" x2="400" y2="1600" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- CodeBanner -->
  <circle cx="640" cy="100" r="30" fill="#AED6F1" stroke="black" stroke-width="2"/>
  <text x="640" y="150" font-family="Arial" font-size="16" text-anchor="middle">CodeBanner</text>
  <line x1="640" y1="130" x2="640" y2="1600" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- tblBanners -->
  <circle cx="880" cy="100" r="30" fill="#AED6F1" stroke="black" stroke-width="2"/>
  <text x="880" y="150" font-family="Arial" font-size="16" text-anchor="middle">tblBanners</text>
  <line x1="880" y1="130" x2="880" y2="1600" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- tblSettings -->
  <circle cx="1120" cy="100" r="30" fill="#AED6F1" stroke="black" stroke-width="2"/>
  <text x="1120" y="150" font-family="Arial" font-size="16" text-anchor="middle">tblSettings</text>
  <line x1="1120" y1="130" x2="1120" y2="1600" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Thanh hoạt động cho Admin -->
  <rect x="155" y="200" width="10" height="1350" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 1. Truy cập trang banner -->
  <line x1="165" y1="230" x2="395" y2="230" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="220" font-family="Arial" font-size="16">Yêu cầu xem danh sách banner</text>
  
  <!-- Thanh hoạt động frmQuanLyBanner -->
  <rect x="395" y="230" width="10" height="90" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 2. Hiển thị giao diện và gọi CodeBanner -->
  <line x1="405" y1="270" x2="635" y2="270" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="260" font-family="Arial" font-size="16">Yêu cầu lấy danh sách banner</text>
  
  <!-- Thanh hoạt động CodeBanner -->
  <rect x="635" y="270" width="10" height="190" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 3. CodeBanner truy vấn dữ liệu từ tblBanners -->
  <line x1="645" y1="310" x2="875" y2="310" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="760" y="300" font-family="Arial" font-size="16">Lấy danh sách banner từ CSDL</text>
  
  <!-- Thanh hoạt động tblBanners -->
  <rect x="875" y="310" width="10" height="80" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 4. tblBanners trả về kết quả -->
  <line x1="875" y1="390" x2="645" y2="390" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="760" y="380" font-family="Arial" font-size="16">Trả về danh sách banner</text>
  
  <!-- 5. CodeBanner truy vấn tblSettings để lấy cấu hình -->
  <line x1="645" y1="430" x2="1115" y2="430" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="880" y="420" font-family="Arial" font-size="16">Lấy cấu hình banner từ CSDL</text>
  
  <!-- Thanh hoạt động tblSettings -->
  <rect x="1115" y="430" width="10" height="80" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 6. tblSettings trả về cấu hình -->
  <line x1="1115" y1="510" x2="645" y2="510" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="880" y="500" font-family="Arial" font-size="16">Trả về cấu hình banner</text>
  
  <!-- 7. CodeBanner trả về kết quả cho form -->
  <line x1="635" y1="550" x2="405" y2="550" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="520" y="540" font-family="Arial" font-size="16">Trả về dữ liệu banner đã xử lý</text>
  
  <!-- Thanh hoạt động frmQuanLyBanner -->
  <rect x="395" y="550" width="10" height="50" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 8. Form hiển thị cho admin -->
  <line x1="395" y1="600" x2="165" y2="600" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="280" y="590" font-family="Arial" font-size="16">Hiển thị danh sách banner</text>
  
  <!-- 9. Admin thêm mới banner -->
  <line x1="165" y1="650" x2="395" y2="650" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="640" font-family="Arial" font-size="16">Nhập thông tin và thêm banner mới</text>
  
  <!-- Thanh hoạt động frmQuanLyBanner -->
  <rect x="395" y="650" width="10" height="60" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 10. Form gửi yêu cầu thêm mới -->
  <line x1="405" y1="710" x2="635" y2="710" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="700" font-family="Arial" font-size="16">Gửi yêu cầu thêm banner mới</text>
  
  <!-- Thanh hoạt động CodeBanner -->
  <rect x="635" y="710" width="10" height="240" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 11. CodeBanner kiểm tra cấu hình với tblSettings -->
  <line x1="645" y1="750" x2="1115" y2="750" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="880" y="740" font-family="Arial" font-size="16">Kiểm tra cấu hình giới hạn banner</text>
  
  <!-- Thanh hoạt động tblSettings -->
  <rect x="1115" y="750" width="10" height="60" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 12. tblSettings trả về cấu hình -->
  <line x1="1115" y1="810" x2="645" y2="810" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="880" y="800" font-family="Arial" font-size="16">Trả về giới hạn banner</text>
  
  <!-- 13. CodeBanner lưu vào tblBanners -->
  <line x1="645" y1="850" x2="875" y2="850" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="760" y="840" font-family="Arial" font-size="16">Thêm banner mới vào CSDL</text>
  
  <!-- Thanh hoạt động tblBanners -->
  <rect x="875" y="850" width="10" height="60" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 14. tblBanners trả về kết quả thêm mới -->
  <line x1="875" y1="910" x2="645" y2="910" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="760" y="900" font-family="Arial" font-size="16">Trả về kết quả thêm mới</text>
  
  <!-- 15. CodeBanner trả về kết quả cho form -->
  <line x1="635" y1="950" x2="405" y2="950" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="520" y="940" font-family="Arial" font-size="16">Thông báo thêm mới thành công</text>
  
  <!-- Thanh hoạt động frmQuanLyBanner -->
  <rect x="395" y="950" width="10" height="50" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 16. Form hiển thị thông báo cho admin -->
  <line x1="395" y1="1000" x2="165" y2="1000" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="280" y="990" font-family="Arial" font-size="16">Hiển thị thông báo thành công</text>
  
  <!-- 17. Admin chỉnh sửa banner -->
  <line x1="165" y1="1050" x2="395" y2="1050" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="1040" font-family="Arial" font-size="16">Chọn và sửa banner</text>
  
  <!-- Thanh hoạt động frmQuanLyBanner -->
  <rect x="395" y="1050" width="10" height="60" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 18. Form gửi yêu cầu cập nhật -->
  <line x1="405" y1="1110" x2="635" y2="1110" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="1100" font-family="Arial" font-size="16">Gửi yêu cầu cập nhật banner</text>
  
  <!-- Thanh hoạt động CodeBanner -->
  <rect x="635" y="1110" width="10" height="150" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 19. CodeBanner cập nhật vào tblBanners -->
  <line x1="645" y1="1150" x2="875" y2="1150" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="760" y="1140" font-family="Arial" font-size="16">Cập nhật thông tin banner trong CSDL</text>
  
  <!-- Thanh hoạt động tblBanners -->
  <rect x="875" y="1150" width="10" height="60" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 20. tblBanners trả về kết quả cập nhật -->
  <line x1="875" y1="1210" x2="645" y2="1210" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="760" y="1200" font-family="Arial" font-size="16">Trả về kết quả cập nhật</text>
  
  <!-- 21. CodeBanner trả về kết quả cho form -->
  <line x1="635" y1="1260" x2="405" y2="1260" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="520" y="1250" font-family="Arial" font-size="16">Thông báo cập nhật thành công</text>
  
  <!-- Thanh hoạt động frmQuanLyBanner -->
  <rect x="395" y="1260" width="10" height="50" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 22. Form hiển thị thông báo cho admin -->
  <line x1="395" y1="1310" x2="165" y2="1310" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="280" y="1300" font-family="Arial" font-size="16">Hiển thị thông báo thành công</text>
  
  <!-- 23. Admin xóa banner -->
  <line x1="165" y1="1350" x2="395" y2="1350" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="1340" font-family="Arial" font-size="16">Chọn và xóa banner</text>
  
  <!-- Thanh hoạt động frmQuanLyBanner -->
  <rect x="395" y="1350" width="10" height="60" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 24. Form gửi yêu cầu xóa -->
  <line x1="405" y1="1410" x2="635" y2="1410" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="1400" font-family="Arial" font-size="16">Gửi yêu cầu xóa banner</text>
  
  <!-- Thanh hoạt động CodeBanner -->
  <rect x="635" y="1410" width="10" height="150" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 25. CodeBanner xóa từ tblBanners -->
  <line x1="645" y1="1450" x2="875" y2="1450" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="760" y="1440" font-family="Arial" font-size="16">Xóa banner khỏi CSDL</text>
  
  <!-- Thanh hoạt động tblBanners -->
  <rect x="875" y="1450" width="10" height="60" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 26. tblBanners trả về kết quả xóa -->
  <line x1="875" y1="1510" x2="645" y2="1510" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="760" y="1500" font-family="Arial" font-size="16">Trả về kết quả xóa</text>
  
  <!-- 27. CodeBanner trả về kết quả cho form -->
  <line x1="635" y1="1560" x2="405" y2="1560" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="520" y="1550" font-family="Arial" font-size="16">Thông báo xóa thành công</text>
  
  <!-- Thanh hoạt động frmQuanLyBanner -->
  <rect x="395" y="1560" width="10" height="50" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 28. Form hiển thị thông báo cho admin -->
  <line x1="395" y1="1610" x2="165" y2="1610" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="280" y="1600" font-family="Arial" font-size="16">Hiển thị thông báo xóa thành công</text>
</svg>
