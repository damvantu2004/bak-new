<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1700" preserveAspectRatio="xMinYMin meet">
  <!-- Định nghĩa các đầu mũi tên -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
    <marker id="dashedarrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>
  
  <!-- Tiêu đề biểu đồ -->
  <text x="600" y="50" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Biểu đồ tuần tự: Quản lý Voucher</text>
  
  <!-- Admin -->
  <circle cx="160" cy="100" r="30" fill="#A9CCE3" stroke="black" stroke-width="2"/>
  <text x="160" y="150" font-family="Arial" font-size="16" text-anchor="middle">Admin</text>
  <line x1="160" y1="130" x2="160" y2="1650" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Các đối tượng (lifeline) -->
  <!-- frmVoucher -->
  <circle cx="400" cy="100" r="30" fill="#AED6F1" stroke="black" stroke-width="2"/>
  <text x="400" y="150" font-family="Arial" font-size="16" text-anchor="middle">Giao diện Voucher</text>
  <line x1="400" y1="130" x2="400" y2="1650" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- CodeVoucher -->
  <circle cx="640" cy="100" r="30" fill="#AED6F1" stroke="black" stroke-width="2"/>
  <text x="640" y="150" font-family="Arial" font-size="16" text-anchor="middle">CodeVoucher</text>
  <line x1="640" y1="130" x2="640" y2="1650" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- tblVouchers -->
  <circle cx="880" cy="100" r="30" fill="#AED6F1" stroke="black" stroke-width="2"/>
  <text x="880" y="150" font-family="Arial" font-size="16" text-anchor="middle">tblVouchers</text>
  <line x1="880" y1="130" x2="880" y2="1650" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Thanh hoạt động cho Admin -->
  <rect x="155" y="200" width="10" height="1400" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 1. Xem danh sách voucher -->
  <!-- ========================== -->
  
  <!-- 1. Admin truy cập trang quản lý voucher -->
  <line x1="165" y1="230" x2="395" y2="230" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="220" font-family="Arial" font-size="14">Truy cập trang voucher</text>
  
  <!-- Thanh hoạt động Giao diện Voucher -->
  <rect x="395" y="230" width="10" height="70" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 2. Giao diện gọi controller -->
  <line x1="405" y1="270" x2="635" y2="270" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="260" font-family="Arial" font-size="14">Yêu cầu danh sách voucher</text>
  
  <!-- Thanh hoạt động CodeVoucher -->
  <rect x="635" y="270" width="10" height="160" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 3. Controller lấy danh sách voucher -->
  <line x1="645" y1="310" x2="875" y2="310" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="760" y="300" font-family="Arial" font-size="14">Truy vấn danh sách voucher</text>
  
  <!-- Thanh hoạt động tblVouchers -->
  <rect x="875" y="310" width="10" height="80" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 4. Database trả về kết quả -->
  <line x1="875" y1="390" x2="645" y2="390" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="760" y="380" font-family="Arial" font-size="14">Dữ liệu voucher</text>
  
  <!-- 5. Controller render view -->
  <line x1="635" y1="430" x2="405" y2="430" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="520" y="420" font-family="Arial" font-size="14">Render trang danh sách</text>
  
  <!-- Thanh hoạt động Giao diện Voucher -->
  <rect x="395" y="430" width="10" height="40" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 6. Hiển thị danh sách voucher -->
  <line x1="395" y1="470" x2="165" y2="470" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="280" y="460" font-family="Arial" font-size="14">Hiển thị danh sách voucher</text>
  
  <!-- 2. Thêm voucher mới -->
  <!-- ==================== -->
  
  <!-- 7. Admin chọn thêm voucher mới -->
  <line x1="165" y1="520" x2="395" y2="520" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="510" font-family="Arial" font-size="14">Chọn thêm voucher mới</text>
  
  <!-- Thanh hoạt động Giao diện Voucher -->
  <rect x="395" y="520" width="10" height="70" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 8. Giao diện gọi controller hiển thị form -->
  <line x1="405" y1="560" x2="635" y2="560" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="550" font-family="Arial" font-size="14">Yêu cầu form thêm mới</text>
  
  <!-- Thanh hoạt động CodeVoucher -->
  <rect x="635" y="560" width="10" height="50" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 9. Controller render form thêm voucher -->
  <line x1="635" y1="610" x2="405" y2="610" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="520" y="600" font-family="Arial" font-size="14">Render form thêm mới</text>
  
  <!-- Thanh hoạt động Giao diện Voucher -->
  <rect x="395" y="610" width="10" height="40" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 10. Hiển thị form thêm voucher -->
  <line x1="395" y1="650" x2="165" y2="650" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="280" y="640" font-family="Arial" font-size="14">Hiển thị form thêm mới</text>
  
  <!-- 11. Admin điền thông tin voucher -->
  <line x1="165" y1="700" x2="395" y2="700" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="690" font-family="Arial" font-size="14">Nhập thông tin voucher</text>
  
  <!-- Thanh hoạt động Giao diện Voucher -->
  <rect x="395" y="700" width="10" height="50" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 12. Form gọi controller lưu thông tin -->
  <line x1="405" y1="750" x2="635" y2="750" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="740" font-family="Arial" font-size="14">Gửi dữ liệu voucher</text>
  
  <!-- Thanh hoạt động CodeVoucher -->
  <rect x="635" y="750" width="10" height="240" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 13. Controller kiểm tra mã voucher tồn tại -->
  <line x1="645" y1="790" x2="875" y2="790" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="760" y="780" font-family="Arial" font-size="14">Kiểm tra mã voucher tồn tại</text>
  
  <!-- Thanh hoạt động tblVouchers -->
  <rect x="875" y="790" width="10" height="80" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 14. Database trả về kết quả kiểm tra -->
  <line x1="875" y1="870" x2="645" y2="870" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="760" y="860" font-family="Arial" font-size="14">Kết quả kiểm tra mã</text>
  
  <!-- 15. Controller lưu voucher mới -->
  <line x1="645" y1="920" x2="875" y2="920" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="760" y="910" font-family="Arial" font-size="14">Lưu thông tin voucher</text>
  
  <!-- Thanh hoạt động tblVouchers -->
  <rect x="875" y="920" width="10" height="70" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 16. Database xác nhận lưu thành công -->
  <line x1="875" y1="990" x2="645" y2="990" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="760" y="980" font-family="Arial" font-size="14">Xác nhận lưu thành công</text>
  
  <!-- 17. Controller render thông báo -->
  <line x1="635" y1="1040" x2="405" y2="1040" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="520" y="1030" font-family="Arial" font-size="14">Render thông báo thành công</text>
  
  <!-- Thanh hoạt động Giao diện Voucher -->
  <rect x="395" y="1040" width="10" height="40" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 18. Hiển thị thông báo thành công -->
  <line x1="395" y1="1080" x2="165" y2="1080" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="280" y="1070" font-family="Arial" font-size="14">Hiển thị thông báo thành công</text>
  
  <!-- 3. Chỉnh sửa voucher -->
  <!-- ====================== -->
  
  <!-- 19. Admin chọn chỉnh sửa voucher -->
  <line x1="165" y1="1130" x2="395" y2="1130" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="1120" font-family="Arial" font-size="14">Chọn chỉnh sửa voucher</text>
  
  <!-- Thanh hoạt động Giao diện Voucher -->
  <rect x="395" y="1130" width="10" height="70" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 20. Giao diện gọi controller lấy thông tin -->
  <line x1="405" y1="1170" x2="635" y2="1170" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="1160" font-family="Arial" font-size="14">Yêu cầu thông tin voucher</text>
  
  <!-- Thanh hoạt động CodeVoucher -->
  <rect x="635" y="1170" width="10" height="160" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 21. Controller lấy thông tin voucher -->
  <line x1="645" y1="1210" x2="875" y2="1210" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="760" y="1200" font-family="Arial" font-size="14">Truy vấn thông tin voucher</text>
  
  <!-- Thanh hoạt động tblVouchers -->
  <rect x="875" y="1210" width="10" height="80" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 22. Database trả về thông tin -->
  <line x1="875" y1="1290" x2="645" y2="1290" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="760" y="1280" font-family="Arial" font-size="14">Thông tin voucher</text>
  
  <!-- 23. Controller render form chỉnh sửa -->
  <line x1="635" y1="1330" x2="405" y2="1330" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="520" y="1320" font-family="Arial" font-size="14">Render form chỉnh sửa</text>
  
  <!-- Thanh hoạt động Giao diện Voucher -->
  <rect x="395" y="1330" width="10" height="40" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 24. Hiển thị form chỉnh sửa -->
  <line x1="395" y1="1370" x2="165" y2="1370" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="280" y="1360" font-family="Arial" font-size="14">Hiển thị form chỉnh sửa</text>
  
  <!-- 25. Admin cập nhật thông tin voucher -->
  <line x1="165" y1="1420" x2="395" y2="1420" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="1410" font-family="Arial" font-size="14">Cập nhật thông tin voucher</text>
  
  <!-- Thanh hoạt động Giao diện Voucher -->
  <rect x="395" y="1420" width="10" height="50" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 26. Form gọi controller cập nhật thông tin -->
  <line x1="405" y1="1470" x2="635" y2="1470" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="1460" font-family="Arial" font-size="14">Gửi dữ liệu cập nhật</text>
  
  <!-- Thanh hoạt động CodeVoucher -->
  <rect x="635" y="1470" width="10" height="130" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 27. Controller cập nhật thông tin voucher -->
  <line x1="645" y1="1510" x2="875" y2="1510" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="760" y="1500" font-family="Arial" font-size="14">Cập nhật thông tin voucher</text>
  
  <!-- Thanh hoạt động tblVouchers -->
  <rect x="875" y="1510" width="10" height="50" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 28. Database xác nhận cập nhật thành công -->
  <line x1="875" y1="1560" x2="645" y2="1560" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="760" y="1550" font-family="Arial" font-size="14">Xác nhận cập nhật thành công</text>
  
  <!-- 29. Controller render thông báo -->
  <line x1="635" y1="1600" x2="405" y2="1600" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="520" y="1590" font-family="Arial" font-size="14">Render thông báo thành công</text>
  
  <!-- Thanh hoạt động Giao diện Voucher -->
  <rect x="395" y="1600" width="10" height="40" fill="#E8E8E8" stroke="black" stroke-width="1"/>
  
  <!-- 30. Hiển thị thông báo thành công -->
  <line x1="395" y1="1640" x2="165" y2="1640" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#dashedarrow)"/>
  <text x="280" y="1630" font-family="Arial" font-size="14">Hiển thị thông báo thành công</text>
</svg>

